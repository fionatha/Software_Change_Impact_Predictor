
<!DOCTYPE html>
<html>
<head>
    <title>Software Change Impact Predictor</title>
</head>
<body>

    <h1>Software Change Impact Predictor</h1>

    <h2>Git Repository Upload</h2>

    <p>Enter your GitHub repository URL below.</p>

    <form action="/analyze" method="POST">

        <label>GitHub Repository URL:</label>

        <input
            type="url"
            name="repo_url"
            placeholder="https://github.com/user/project"
            required
        >

        <button type="submit">Analyze Repository</button>

    </form>

</body>
</html>
